name: Deploy React App to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'ict/**'    # Only trigger when React app changes

jobs:
  deploy-react:
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout Repository
        uses: actions/checkout@v4

      - name: 🧩 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: ict/package-lock.json

      - name: 🏗️ Build React App
        working-directory: ict
        run: |
          npm ci
          npm run build

      - name: 🔐 Set up SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 🧱 Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H 178.16.137.226 >> ~/.ssh/known_hosts

      - name: 🚀 Upload React Build to VPS
        run: |
          echo "🚚 Deploying React build to VPS..."
          rsync -avz --delete ict/build/ rishabhvyas@178.16.137.226:/home/rishabhvyas/bookledger/ict/build/
          echo "✅ React app deployed successfully!"
